<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1E3A8A" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
:root {
  --indigo: #1e3a8a;
  --indigo-soft: #dbeafe;
  --crimson: #dc2626;
  --amber: #d97706;
  --amber-soft: #fef3c7;
  --emerald: #059669;
  --emerald-soft: #d1fae5;
  --surface: #f1f5f9;
  --card: #ffffff;
  --text: #0f172a;
  --text-2: #475569;
  --text-3: #94a3b8;
  --border: #e2e8f0;
  --cat-transit: #2563eb;
  --cat-transit-bg: #eff6ff;
  --cat-sight: #7c3aed;
  --cat-sight-bg: #f5f3ff;
  --cat-gourmet: #ea580c;
  --cat-gourmet-bg: #fff7ed;
  --cat-shop: #db2777;
  --cat-shop-bg: #fdf2f8;
  --cat-onsen: #0d9488;
  --cat-onsen-bg: #f0fdfa;
  --cat-hotel: #4b5563;
  --cat-hotel-bg: #f3f4f6;
  --nav-h: 64px;
  --top-h: 64px;
  --radius: 14px;
  --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
  --font: "IBM Plex Sans KR", system-ui, sans-serif;
  --display: "Outfit", "IBM Plex Sans KR", sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  font-family: var(--font);
  color: var(--text);
  background:
    radial-gradient(1200px 600px at 10% -10%, #bfdbfe 0%, transparent 55%),
    radial-gradient(900px 500px at 100% 0%, #fecaca 0%, transparent 45%),
    linear-gradient(180deg, #e8eef8 0%, var(--surface) 40%, #e2e8f0 100%);
  background-attachment: fixed;
}

body {
  -webkit-font-smoothing: antialiased;
}

.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 55%, #0f2865 100%);
  color: #fff;
  padding: 12px 16px calc(12px + env(safe-area-inset-top));
  box-shadow: 0 4px 20px rgba(30, 58, 138, 0.35);
}

.topbar-inner {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-icon {
  width: 28px;
  height: 28px;
  color: #fde68a;
  flex-shrink: 0;
}

.brand {
  margin: 0;
  font-family: var(--display);
  font-size: 1.15rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.2;
}

.brand-sub {
  margin: 4px 0 0;
  display: inline-block;
  padding: 2px 10px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.18);
  font-size: 0.72rem;
  color: #e2e8f0;
}

.main {
  flex: 1;
  padding: 16px 14px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom));
}

.bottom-nav {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 0;
  width: min(720px, 100%);
  height: calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  z-index: 50;
}

.nav-btn {
  border: 0;
  background: transparent;
  color: var(--text-3);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  font-family: inherit;
  font-size: 0.65rem;
  font-weight: 500;
  cursor: pointer;
  padding: 8px 2px;
}

.nav-btn svg {
  width: 22px;
  height: 22px;
}

.nav-btn.active {
  color: var(--indigo);
  font-weight: 700;
}

.nav-btn.active svg {
  filter: drop-shadow(0 2px 4px rgba(30, 58, 138, 0.25));
}

.panel-title {
  margin: 0 0 4px;
  font-family: var(--display);
  font-size: 1.25rem;
  font-weight: 700;
}

.panel-desc {
  margin: 0 0 14px;
  color: var(--text-2);
  font-size: 0.88rem;
  line-height: 1.45;
}

.chip-row {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 10px;
  margin-bottom: 8px;
  scrollbar-width: none;
}

.chip-row::-webkit-scrollbar {
  display: none;
}

.chip {
  border: 1px solid var(--border);
  background: #fff;
  color: var(--text-2);
  border-radius: 999px;
  padding: 8px 14px;
  font-size: 0.8rem;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
  font-family: inherit;
  transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
}

.chip:hover {
  transform: translateY(-1px);
}

.chip.active {
  background: var(--indigo);
  border-color: var(--indigo);
  color: #fff;
}

.search {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 11px 14px;
  font: inherit;
  margin-bottom: 12px;
  background: #fff;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  animation: rise 0.35s ease both;
}

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

.card.done {
  opacity: 0.72;
}

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 8px;
}

.time {
  font-family: var(--display);
  font-weight: 700;
  color: var(--indigo);
  font-size: 0.92rem;
}

.badge {
  display: inline-block;
  border-radius: 8px;
  padding: 3px 8px;
  font-size: 0.7rem;
  font-weight: 700;
}

.badge.교통 { background: var(--cat-transit-bg); color: var(--cat-transit); }
.badge.관광 { background: var(--cat-sight-bg); color: var(--cat-sight); }
.badge.맛집 { background: var(--cat-gourmet-bg); color: var(--cat-gourmet); }
.badge.쇼핑 { background: var(--cat-shop-bg); color: var(--cat-shop); }
.badge.온천 { background: var(--cat-onsen-bg); color: var(--cat-onsen); }
.badge.숙소 { background: var(--cat-hotel-bg); color: var(--cat-hotel); }

.card h3 {
  margin: 0 0 6px;
  font-size: 1.02rem;
  line-height: 1.35;
}

.meta {
  color: var(--text-2);
  font-size: 0.82rem;
  margin: 0 0 8px;
}

.tip {
  background: var(--amber-soft);
  color: #92400e;
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 0.82rem;
  line-height: 1.45;
  margin-top: 10px;
}

.safe {
  background: var(--emerald-soft);
  color: #065f46;
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 0.82rem;
  line-height: 1.45;
  margin-top: 8px;
}

.muted {
  color: var(--text-2);
  font-size: 0.84rem;
  line-height: 1.5;
  margin: 0;
}

.actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  flex-wrap: wrap;
}

.btn {
  border: 0;
  border-radius: 10px;
  padding: 8px 12px;
  font: inherit;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
}

.btn-primary {
  background: var(--indigo);
  color: #fff;
}

.btn-ghost {
  background: var(--indigo-soft);
  color: var(--indigo);
}

.btn-danger {
  background: #fee2e2;
  color: var(--crimson);
}

.hero-banner {
  background: linear-gradient(135deg, #0f2865, #1e3a8a 40%, #b91c1c);
  color: #fff;
  border-radius: var(--radius);
  padding: 18px 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}

.hero-banner h2 {
  margin: 0 0 6px;
  font-family: var(--display);
  font-size: 1.15rem;
}

.hero-banner p {
  margin: 0;
  opacity: 0.9;
  font-size: 0.86rem;
  line-height: 1.45;
}

.step-list {
  margin: 10px 0 0;
  padding-left: 18px;
  color: var(--text-2);
  font-size: 0.86rem;
  line-height: 1.55;
}

.pass-grid {
  display: grid;
  gap: 10px;
}

.pass-item {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
}

.pass-item strong {
  display: block;
  margin-bottom: 4px;
  color: var(--indigo);
}

.check-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 8px;
  cursor: pointer;
}

.check-item input {
  margin-top: 3px;
  width: 18px;
  height: 18px;
  accent-color: var(--indigo);
}

.check-item.checked span {
  text-decoration: line-through;
  color: var(--text-3);
}

.section-label {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--text-3);
  text-transform: none;
  letter-spacing: 0.02em;
  margin: 16px 0 8px;
}

.subtabs {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}

.subtab {
  border: 1px solid var(--border);
  background: #fff;
  border-radius: 10px;
  padding: 10px;
  font: inherit;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-2);
  cursor: pointer;
}

.subtab.active {
  background: var(--indigo);
  border-color: var(--indigo);
  color: #fff;
}

.link-card {
  display: block;
  text-decoration: none;
  color: inherit;
}

.link-card:hover h3 {
  color: var(--indigo);
}

.phrase-card {
  cursor: pointer;
}

.phrase-card .ja {
  font-size: 1.05rem;
  font-weight: 700;
  margin: 6px 0;
  line-height: 1.4;
}

.flash {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.72);
  z-index: 80;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: fade 0.2s ease;
}

@keyframes fade {
  from { opacity: 0; }
  to { opacity: 1; }
}

.flash-card {
  width: min(520px, 100%);
  background: #fff;
  border-radius: 18px;
  padding: 24px 20px;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
}

.flash-card .ko {
  color: var(--text-2);
  font-size: 0.95rem;
  margin-bottom: 12px;
}

.flash-card .ja-big {
  font-size: clamp(1.4rem, 5vw, 2rem);
  font-weight: 800;
  line-height: 1.35;
  margin: 0 0 10px;
  color: var(--indigo);
}

.flash-card .pron {
  color: var(--crimson);
  font-weight: 600;
  margin-bottom: 16px;
}

.empty {
  text-align: center;
  color: var(--text-3);
  padding: 40px 12px;
}

@media (min-width: 768px) {
  .main {
    padding-left: 20px;
    padding-right: 20px;
  }

  .brand {
    font-size: 1.3rem;
  }
}

</style>
</head>

  <div class="app">

  <script type="module">
const STORAGE_KEY = "osaka-kokura-trip-v1";

const state = {
  tab: "schedule",
  day: 1,
  category: "전체",
  search: "",
  gourmetCity: "전체",
  gourmetCat: "전체",
  sosSub: 0,
  phraseCat: "전체",
  data: null,
  completed: {},
  checked: {},
  flash: null,
};

const CAT_ORDER = ["전체", "교통", "관광", "맛집", "쇼핑", "온천", "숙소"];

function loadPersist() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const p = JSON.parse(raw);
    state.completed = p.completed || {};
    state.checked = p.checked || {};
  } catch (_) {}
}

function savePersist() {
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify({ completed: state.completed, checked: state.checked })
  );
}

function esc(s) {
  return String(s ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ja-JP";
  u.rate = 0.9;
  window.speechSynthesis.speak(u);
}

async function boot() {

  state.data = {

      },
      {

      }
    ]
  },
  "schedules": [
    {
      "dayNumber": 1,
      "dateText": "9월 20일 (토)",
      "city": "오사카",
      "timeSlot": "10:00 - 11:30",
      "title": "간사이 국제공항(KIX) 도착 및 신오사카 이동",
      "category": "교통",
      "locationName": "간사이공항역 -> 신오사카역",
      "transitGuide": "JR 간사이공항역에서 '특급 하루카(HARUKA)' 탑승 (약 50분 소요, 신오사카역 직통). 키티 캐릭터 래핑 열차 운행.",
      "description": "간사이 공항 입국 심사 및 수하물 수령 후 2층 연결통로로 철도역 이동. 모바일 승차권 또는 여권으로 하루카 티켓 발권.",
      "kidsFriendlyTip": "헬로키티 하루카 열차 앞에서 기념사진을 찍어주세요! 초등학생용 소아 이코카(ICOCA) 카드는 여권 제시 시 50% 할인 요금으로 구매 가능합니다.",

function render() {
  const main = document.getElementById("main");
  const map = {
    schedule: renderSchedule,
    transit: renderTransit,
    gourmet: renderGourmet,
    sos: renderSos,
    checklist: renderChecklist,
  };
  main.innerHTML = map[state.tab]();
  bindMain();
  renderModal();
}

function bindMain() {
  const main = document.getElementById("main");

  main.querySelectorAll("[data-day]").forEach((el) => {
    el.addEventListener("click", () => {
      state.day = Number(el.dataset.day);
      render();
    });
  });
  main.querySelectorAll("[data-cat]").forEach((el) => {
    el.addEventListener("click", () => {
      state.category = el.dataset.cat;
      render();
    });
  });
  const search = main.querySelector("#search");
  if (search) {
    search.addEventListener("input", (e) => {
      state.search = e.target.value;
      // soft re-render schedule list only
      const list = main.querySelector("#schedule-list");
      if (list) list.innerHTML = scheduleCardsHtml();
      bindScheduleCards();
    });
  }
  bindScheduleCards();

  main.querySelectorAll("[data-gcity]").forEach((el) => {
    el.addEventListener("click", () => {
      state.gourmetCity = el.dataset.gcity;
      render();
    });
  });
  main.querySelectorAll("[data-gcat]").forEach((el) => {
    el.addEventListener("click", () => {
      state.gourmetCat = el.dataset.gcat;
      render();
    });
  });

  main.querySelectorAll("[data-sos]").forEach((el) => {
    el.addEventListener("click", () => {
      state.sosSub = Number(el.dataset.sos);
      render();
    });
  });
  main.querySelectorAll("[data-pcat]").forEach((el) => {
    el.addEventListener("click", () => {
      state.phraseCat = el.dataset.pcat;
      render();
    });
  });
  main.querySelectorAll("[data-phrase]").forEach((el) => {
    el.addEventListener("click", () => {
      const id = Number(el.dataset.phrase);
      state.flash = state.data.phrases.find((p) => p.id === id) || null;
      renderModal();
    });
  });

  main.querySelectorAll("[data-check]").forEach((el) => {
    el.addEventListener("change", () => {
      const id = el.dataset.check;
      state.checked[id] = el.checked;
      savePersist();
      el.closest(".check-item")?.classList.toggle("checked", el.checked);
    });
  });
}

function bindScheduleCards() {
  const main = document.getElementById("main");
  main.querySelectorAll("[data-toggle]").forEach((el) => {
    el.addEventListener("click", () => {
      const id = el.dataset.toggle;
      state.completed[id] = !state.completed[id];
      savePersist();
      render();
    });
  });
}

function filteredSchedules() {
  const q = state.search.trim().toLowerCase();
  return state.data.schedules.filter((s) => {
    if (s.dayNumber !== state.day) return false;
    if (state.category !== "전체" && s.category !== state.category) return false;
    if (!q) return true;
    const hay = [s.title, s.locationName, s.transitGuide, s.restaurantName, s.kidsFriendlyTip, s.description]
      .join(" ")
      .toLowerCase();
    return hay.includes(q);
  });
}

  const items = filteredSchedules();
  if (!items.length) return `<p class="empty">해당 조건의 일정이 없습니다.</p>`;
  return items
    .map((s, i) => {
      const done = !!state.completed[s.id];
      return `
      <article class="card ${done ? "done" : ""}" style="animation-delay:${i * 40}ms">
        <div class="card-top">
          <span class="time">${esc(s.timeSlot)}</span>
          <span class="badge ${esc(s.category)}">${esc(s.category)}</span>
        </div>
        <h3>${esc(s.title)}</h3>
        <p class="meta">${esc(s.city)} · ${esc(s.locationName)}</p>
        <p class="muted">${esc(s.description)}</p>
        <p class="muted" style="margin-top:8px"><strong>이동:</strong> ${esc(s.transitGuide)}</p>
        ${s.kidsFriendlyTip ? `<div class="tip"><strong>아이 팁</strong><br>${esc(s.kidsFriendlyTip)}</div>` : ""}
        ${
          s.restaurantName
            ? `<div class="safe"><strong>${esc(s.restaurantName)}</strong><br>${esc(s.restaurantMenu)}<br>${esc(s.restaurantFeature)}</div>`
            : ""
        }
        <div class="actions">
          <button type="button" class="btn ${done ? "btn-ghost" : "btn-primary"}" data-toggle="${s.id}">
            ${done ? "완료 취소" : "일정 완료"}
          </button>
        </div>
      </article>`;
    })
    .join("");
}

function renderSchedule() {
  const dayMeta = state.data.meta.days.find((d) => d.day === state.day);
  return `
    <h2 class="panel-title">일정표</h2>
    <p class="panel-desc">${esc(dayMeta?.date || "")} · ${esc(dayMeta?.city || "")}</p>
    <div class="chip-row">
      ${state.data.meta.days
        .map(
          (d) =>
            `<button type="button" class="chip ${state.day === d.day ? "active" : ""}" data-day="${d.day}">${esc(d.label)} ${esc(d.date)}</button>`
        )
        .join("")}
    </div>
    <div class="chip-row">
      ${CAT_ORDER.map(
        (c) =>
          `<button type="button" class="chip ${state.category === c ? "active" : ""}" data-cat="${esc(c)}">${esc(c)}</button>`
      ).join("")}
    </div>
    <input id="search" class="search" type="search" placeholder="장소, 맛집, 이동수단 검색…" value="${esc(state.search)}" />
    <div id="schedule-list">${scheduleCardsHtml()}</div>
  `;
}

function renderTransit() {
  const t = state.data.transit;
  return `
    <div class="hero-banner">
      <h2>${esc(t.header.title)}</h2>
      <p>${esc(t.header.description)}</p>
    </div>
    ${t.sections
      .map(
        (s, i) => `
      <article class="card" style="animation-delay:${i * 50}ms">
        <div class="card-top">
          <span class="badge" style="background:${esc(s.badgeColor)};color:#fff">${esc(s.badgeText)}</span>
        </div>
        <h3>${esc(s.title)}</h3>
        <p class="meta">${esc(s.routeSummary)}</p>
        <ol class="step-list">${s.steps.map((st) => `<li>${esc(st)}</li>`).join("")}</ol>
        <div class="tip">${esc(s.tip)}</div>
      </article>`
      )
      .join("")}
    <article class="card">
      <h3>${esc(t.kitakyushuPass.title)}</h3>
      <div class="pass-grid" style="margin-top:12px">
        ${t.kitakyushuPass.benefits
          .map(
            (b) => `
          <div class="pass-item">
            <strong>${esc(b.title)}</strong>
            <span class="muted">${esc(b.description)}</span>
          </div>`
          )
          .join("")}
      </div>
    </article>
  `;
}

function renderGourmet() {
  const cities = ["전체", "오사카", "키타큐슈", "교토"];
  const cats = ["전체", "돈카츠", "우동", "함바그·양식", "야키카레", "오코노미야키", "샌드위치", "베이커리", "라멘", "쿠시카츠"];
  const items = state.data.gourmet.filter((g) => {
    if (state.gourmetCity !== "전체" && g.city !== state.gourmetCity) return false;
    if (state.gourmetCat !== "전체" && g.category !== state.gourmetCat) return false;
    return true;
  });
  return `
    <div class="hero-banner">
      <h2>100% 안심 보증: 회 &amp; 내장 요리 완전 제외</h2>
      <p>초등학생 아이들이 환호하는 일본인들의 현지 찐 맛집</p>
    </div>
    <div class="chip-row">
      ${cities
        .map(
          (c) =>
            `<button type="button" class="chip ${state.gourmetCity === c ? "active" : ""}" data-gcity="${esc(c)}">${esc(c)}</button>`
        )
        .join("")}
    </div>
    <div class="chip-row">
      ${cats
        .map(
          (c) =>
            `<button type="button" class="chip ${state.gourmetCat === c ? "active" : ""}" data-gcat="${esc(c)}">${esc(c)}</button>`
        )
        .join("")}
    </div>
    ${
      items.length
        ? items
            .map(
              (g, i) => `
      <article class="card" style="animation-delay:${i * 40}ms">
        <div class="card-top">
          <span class="badge 맛집">${esc(g.category)}</span>
          <span class="meta" style="margin:0">${esc(g.city)}</span>
        </div>
        <h3>${esc(g.nameKo)}</h3>
        <p class="meta">${esc(g.nameJa)} · ${esc(g.area)}</p>
        <p class="muted"><strong>아이 메뉴:</strong> ${esc(g.kidMenu)}</p>
        <p class="muted"><strong>가격:</strong> ${esc(g.price)}</p>
        <p class="muted" style="margin-top:8px">${esc(g.localFeature)}</p>
        <div class="tip">${esc(g.kidComfortTip)}</div>
        <div class="actions">
          <a class="btn btn-ghost" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(g.addressQuery || g.nameJa || g.nameKo)}">지도에서 찾기</a>
        </div>
      </article>`
            )
            .join("")
        : `<p class="empty">조건에 맞는 맛집이 없습니다.</p>`
    }
  `;
}

function renderSos() {
  const tabs = ["대체 실내코스", "실시간 정보", "비상연락망", "비상 일본어"];
  let body = "";
  if (state.sosSub === 0) {
    body = state.data.alternatives
      .map(
        (a, i) => `
      <article class="card" style="animation-delay:${i * 40}ms">
        <div class="card-top">
          <span class="badge" style="background:#fee2e2;color:#b91c1c">Day ${a.dayNumber}</span>
          <span class="meta" style="margin:0">${esc(a.situation)}</span>
        </div>
        <h3>${esc(a.alternativeTitle)}</h3>
        <p class="meta">원래: ${esc(a.originalSpot)}</p>
        <p class="muted">${esc(a.description)}</p>
        <p class="muted" style="margin-top:8px"><strong>이동:</strong> ${esc(a.transitGuide)}</p>
        <div class="safe">${esc(a.indoorAdvantage)}</div>
        <div class="tip">${esc(a.nearbyFoodTip)}</div>
      </article>`
      )
      .join("");
  } else if (state.sosSub === 1) {
    body =
      `<p class="section-label">실시간 교통</p>` +
      state.data.trafficLinks
        .map(
          (t) => `
        <a class="card link-card" href="${esc(t.url)}" target="_blank" rel="noopener">
          <h3>${esc(t.title)}</h3>
          <p class="meta">${esc(t.lineName)}</p>
          <p class="muted">${esc(t.description)}</p>
          <div class="tip">${esc(t.delayTip)}</div>
        </a>`
        )
        .join("") +
      `<p class="section-label">날씨 가이드</p>` +
      state.data.weatherGuides
        .map(
          (w) => `
        <a class="card link-card" href="${esc(w.officialUrl)}" target="_blank" rel="noopener">
          <h3>${esc(w.cityName)}</h3>
          <p class="meta">${esc(w.region)} · ${esc(w.avgTemp)}</p>
          <p class="muted">${esc(w.weatherTips)}</p>
          <div class="safe">${esc(w.rainyAlternativeSummary)}</div>
        </a>`
        )
        .join("");
  } else if (state.sosSub === 2) {
    const grouped = {};
    for (const c of state.data.contacts) {
      (grouped[c.category] ||= []).push(c);
    }
    body = Object.entries(grouped)
      .map(
        ([cat, list]) => `
      <p class="section-label">${esc(cat)}</p>
      ${list
        .map(
          (c) => `
        <article class="card">
          <h3>${esc(c.name)}</h3>
          <p class="meta"><a href="tel:${esc(c.phoneNumber)}">${esc(c.phoneNumber)}</a>${c.emergencyPhone ? ` · 비상 ${esc(c.emergencyPhone)}` : ""}</p>
          ${c.address ? `<p class="muted">${esc(c.address)}</p>` : ""}
          ${c.note ? `<div class="tip">${esc(c.note)}</div>` : ""}
        </article>`
        )
        .join("")}`
      )
      .join("");
  } else {
    const cats = ["전체", ...new Set(state.data.phrases.map((p) => p.category))];
    const list = state.data.phrases.filter(
      (p) => state.phraseCat === "전체" || p.category === state.phraseCat
    );
    body =
      `<div class="chip-row">${cats
        .map(
          (c) =>
            `<button type="button" class="chip ${state.phraseCat === c ? "active" : ""}" data-pcat="${esc(c)}">${esc(c)}</button>`
        )
        .join("")}</div>` +
      list
        .map(
          (p) => `
        <article class="card phrase-card" data-phrase="${p.id}">
          <p class="meta">${esc(p.category)}</p>
          <h3>${esc(p.koreanTitle)}</h3>
          <p class="ja">${esc(p.japaneseText)}</p>
          <p class="muted">${esc(p.pronunciation)}</p>
        </article>`
        )
        .join("");
  }

  return `
    <h2 class="panel-title">돌발·SOS</h2>
    <p class="panel-desc">우천 대체 코스, 실시간 교통·날씨, 비상연락망, 일본어 회화</p>
    <div class="subtabs">
      ${tabs
        .map(
          (t, i) =>
            `<button type="button" class="subtab ${state.sosSub === i ? "active" : ""}" data-sos="${i}">${esc(t)}</button>`
        )
        .join("")}
    </div>
    ${body}
  `;
}

function renderChecklist() {
  const grouped = {};
  for (const c of state.data.checklists) {
    (grouped[c.category] ||= []).push(c);
  }
  const total = state.data.checklists.length;
  const done = state.data.checklists.filter((c) => state.checked[c.id]).length;
  return `
    <h2 class="panel-title">체크리스트</h2>
    <p class="panel-desc">준비 ${done}/${total} 완료 · 상태는 이 기기에 저장됩니다</p>
    ${Object.entries(grouped)
      .map(
        ([cat, list]) => `
      <p class="section-label">${esc(cat)}</p>
      ${list
        .map((c) => {
          const on = !!state.checked[c.id];
          return `
          <label class="check-item ${on ? "checked" : ""}">
            <input type="checkbox" data-check="${c.id}" ${on ? "checked" : ""} />
            <span>${esc(c.title)}</span>
          </label>`;
        })
        .join("")}`
      )
      .join("")}
  `;
}

function renderModal() {
  const root = document.getElementById("modal-root");
  if (!state.flash) {
    root.innerHTML = "";
    return;
  }
  const p = state.flash;
  root.innerHTML = `
    <div class="flash" role="dialog" aria-modal="true">
      <div class="flash-card">
        <p class="ko">${esc(p.koreanTitle)}</p>
        <p class="ja-big">${esc(p.japaneseText)}</p>
        <p class="pron">${esc(p.pronunciation)}</p>
        <p class="muted">${esc(p.situationTip)}</p>
        <div class="actions" style="justify-content:center;margin-top:18px">
          <button type="button" class="btn btn-primary" id="speak-btn">일본어 읽기</button>
          <button type="button" class="btn btn-ghost" id="close-flash">닫기</button>
        </div>
      </div>
    </div>`;
  root.querySelector("#close-flash").onclick = () => {
    state.flash = null;
    renderModal();
  };
  root.querySelector("#speak-btn").onclick = () => speak(p.japaneseText);
  root.querySelector(".flash").addEventListener("click", (e) => {
    if (e.target.classList.contains("flash")) {
      state.flash = null;
      renderModal();
    }
  });
}

boot().catch((err) => {
  document.getElementById("main").innerHTML = `<p class="empty">데이터를 불러오지 못했습니다.<br>${esc(err.message)}</p>`;
});

</script>
</body>
</html>
