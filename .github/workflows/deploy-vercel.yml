name: Sync secrets & Deploy Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        id: check
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=0
          if [ -z "$NVIDIA_API_KEY" ]; then
            echo "::warning::NVIDIA_API_KEY GitHub secret is missing"
            missing=1
          fi
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN GitHub secret is missing (CLI deploy will be skipped if unset)"
          fi
          echo "missing_nvidia=$missing" >> "$GITHUB_OUTPUT"

      - name: Install Vercel CLI
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        run: npm install -g vercel@latest

      - name: Sync NVIDIA_API_KEY to Vercel
        if: ${{ secrets.NVIDIA_API_KEY != '' && secrets.VERCEL_TOKEN != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          # Link if project ids provided via secrets; otherwise use linked project from vercel pull
          if [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "Using org/project from secrets"
          fi
          printf '%s' "$NVIDIA_API_KEY" | vercel env add NVIDIA_API_KEY production --force --token="$VERCEL_TOKEN" || true
          printf '%s' "$NVIDIA_API_KEY" | vercel env add NVIDIA_API_KEY preview --force --token="$VERCEL_TOKEN" || true

      - name: Deploy to Vercel (production)
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          URL=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN")
          echo "Deployed: $URL"
          echo "### Production" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
