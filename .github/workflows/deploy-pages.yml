name: Deploy GitHub Pages
on:
  # Run after merge to main, or manually once Pages is enabled
  # (Settings → Pages → Source: GitHub Actions)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure GitHub Pages is configured
        id: pages_check
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Skip if Pages not available
        if: steps.pages_check.outcome != 'success'
        run: |
          echo "::warning::GitHub Pages is not enabled for this repository."
          echo "Enable it at Settings → Pages → Source: GitHub Actions, then re-run this workflow."
          echo "skip=true" >> "$GITHUB_ENV"
      - uses: actions/upload-pages-artifact@v3
        if: env.skip != 'true'
        with:
          path: docs
      - id: deployment
        if: env.skip != 'true'
        uses: actions/deploy-pages@v4
